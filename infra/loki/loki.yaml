# Loki (monolítico, disco local): armazena os logs.
# Entra: logs OTLP do Alloy em /otlp/v1/logs. Sai: LogQL para o Grafana.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # trace_id, span_id, severity_text e os campos do log ficam como structured metadata:
  # filtráveis (| trace_id="...") sem virar label de stream (que tem de ter baixa cardinalidade)
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h   # 7 dias

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
