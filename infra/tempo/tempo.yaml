# Tempo (monolítico, disco local): armazena os traces.
# Entra: OTLP do Alloy (:4317 gRPC / :4318 HTTP, só na rede do compose).
# Sai: TraceQL para o Grafana (:3200) e, pelo metrics-generator, span metrics e service graph
#      com exemplars (trace id) via remote_write no Prometheus.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h   # 7 dias

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # service-graphs: mapa backend -> postgres; span-metrics: traces_spanmetrics_* (RED por span, com exemplars);
      # local-blocks: habilita as consultas de métricas do TraceQL no Grafana
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
