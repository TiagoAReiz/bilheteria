include:
  - infra/search/compose.search.yaml   # Elasticsearch + Sequin (busca por CDC)
  - infra/payment/compose.payment.yaml # túnel do webhook do Mercado Pago (profile tunnel)
  - infra/storage/compose.storage.yaml # S3 (LocalStack) das imagens de eventos e avatares

services:

  db:
    # versão fixa: a imagem sem tag virou a 18, e trocar de major exige migrar os dados (pg_upgrade)
    image: postgres:18.6
    restart: always
    # wal_level=logical: o Sequin lê as mudanças de event/ticket pelo WAL (CDC).
    # max_slot_wal_keep_size: teto de WAL que o slot pode reter se o Sequin ficar parado.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # volume COM NOME: sem ele o Postgres grava num volume anônimo, que o `docker compose down`
    # apaga junto com o contêiner (os dados somem). A partir do 18 o diretório é /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Aplicação. Segredos e configs vêm do backend/.env (o mesmo do `npm run start:dev`); o
  # `environment` só troca os endereços "localhost" pelos nomes dos serviços na rede do compose.
  # As URLs que o NAVEGADOR usa (BETTER_AUTH_URL, FRONTEND_URL, STORAGE_PUBLIC_URL) continuam
  # em localhost. Rodar a API/front pelo npm ao mesmo tempo dá conflito nas portas 3000/3001:
  #   docker compose up -d --scale api=0 --scale frontend=0   (só a infra)
  # ---------------------------------------------------------------------------

  # aplica as migrations pendentes e sai; a API só sobe depois que ele termina com sucesso
  migrate:
    build:
      context: ./backend
      target: build
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      STORAGE_S3_ENDPOINT: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - 3001:3001
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Observabilidade (Grafana LGTM). Configs em infra/. Fluxo:
  #   backend --OTLP--> alloy --> prometheus (métricas) / loki (logs) / tempo (traces) --> grafana
  #   postgres-exporter <--scrape-- prometheus
  # ---------------------------------------------------------------------------

  # coletor único: recebe OTLP do backend e distribui para Prometheus, Loki e Tempo
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - 4317:4317     # OTLP gRPC
      - 4318:4318     # OTLP HTTP (usado pelo backend)
      - 12345:12345   # UI de debug do Alloy (grafo de componentes)
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # recebe as métricas do Alloy e as span metrics do Tempo via remote_write
      - --web.enable-remote-write-receiver
      # guarda os exemplars (trace_id) que ligam um ponto do gráfico ao trace no Tempo
      - --enable-feature=exemplar-storage
    ports:
      - 9090:9090
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - 3100:3100
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  # a imagem do Tempo roda como usuário 10001 e o volume nasce do root: ajusta o dono uma vez
  tempo-init:
    # a imagem do Tempo é distroless (sem chown); busybox só ajusta o dono do volume
    image: busybox:1.37.0
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - 3200:3200     # API (Grafana consulta aqui); OTLP 4317/4318 só na rede interna, vindo do Alloy
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started   # recebe as span metrics / service graph

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    ports:
      - 9187:9187
    depends_on:
      - db

  grafana:
    image: grafana/grafana:12.4.14
    restart: unless-stopped
    ports:
      - 3002:3000     # 3000 é a API e 3001 o front
    environment:
      # SÓ PARA DEV: login admin/admin. Fora da máquina local, use segredo de verdade
      # (GF_SECURITY_ADMIN_PASSWORD__FILE) ou SSO.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres-data:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
